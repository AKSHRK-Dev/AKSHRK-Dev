<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="820" height="200" role="img" aria-label="Hello in 62 languages">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14497e"/><stop offset="1" stop-color="#1b60a6"/></linearGradient></defs>
<style>
.g { font: 800 56px system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans JP", sans-serif; fill: #fff; text-anchor: middle; opacity: 0; animation: show 52.8s infinite; }
@keyframes show { 0% { opacity: 0; transform: translateY(14px); } 0.75% { opacity: 1; transform: none; } 3.42% { opacity: 1; transform: none; } 4.17% { opacity: 0; transform: translateY(-14px); } 100% { opacity: 0; } }
.d { fill: #7fb2ea; opacity: .25; animation: tw 4s ease-in-out infinite; }
@keyframes tw { 50% { opacity: .8; } }
.sub { font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #cfe2f8; text-anchor: middle; letter-spacing: 2px; }
.orbit { fill: none; stroke: #7fb2ea; stroke-opacity: .35; stroke-dasharray: 4 8; animation: flow 6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -120; } }
@media (prefers-reduced-motion: reduce) { .g { animation: none; } .g:first-of-type { opacity: 1; } .orbit, .d { animation: none; } }
</style>
